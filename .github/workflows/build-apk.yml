name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les fichiers web et l'icône
        run: |
          mkdir -p www assets
          cp index.html style.css app.js config.js www/
          cp icon.png assets/icon.png

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#3d4dff' --iconBackgroundColorDark '#3d4dff'

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: murmure-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
